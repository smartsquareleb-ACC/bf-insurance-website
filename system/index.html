<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a3aa6">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BF Desk">
<title>BF Policy Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* White office app: white ground, sapphire blue for every action and accent. Light only (Charbel). */
:root{
  --bg:#FFFFFF; --panel:#F5F7FC; --line:#E1E6F2; --fg:#111A33; --muted:#5D6782;
  --brand:#1A3AA6; --brand-dark:#122C80; --brand-soft:#EAEFFC; --brand-ink:#FFFFFF;
  --ok:#11795A; --ok-soft:#E3F4EE; --warn:#A55A00; --warn-soft:#FCF0DE; --bad:#B4233A; --bad-soft:#FBE7EA; --wa:#128C4A;
  --font:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.mark{width:38px;height:38px;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:600;color:var(--brand)}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.spacer{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav button[aria-current="true"]{background:var(--brand);color:var(--brand-ink);font-weight:500}
.count{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
nav button[aria-current="true"] .count{background:#fff;color:var(--brand)}
main{padding-block:20px 80px}
h2{font-size:21px;margin:0 0 4px;font-weight:600;color:var(--fg)}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin:28px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--brand);font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-dark)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.month{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.month b{font-size:18px;font-weight:600;min-width:150px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:var(--r);padding:14px 16px}
.kpi.main{background:var(--brand);color:#fff}
.kpi span{display:block;font-size:12px;opacity:.8;letter-spacing:.02em}
.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{font-size:12px;opacity:.75}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row>div:last-child{justify-self:end}
.row:hover{background:var(--panel)}
.who b{display:block;font-weight:500}
.who small,.meta small{color:var(--muted);font-size:12.5px}
.meta{min-width:0}
.meta .line{display:block;font-size:13.5px;color:var(--fg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--panel);color:var(--muted)}.pill.b{background:var(--brand-soft);color:var(--brand)}
.plate{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:0 6px;white-space:nowrap}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.row .meta{grid-column:1}.row .hide-sm{display:none}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{flex:1 1 160px;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
label.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--fg);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0 0 6px}
legend{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:600;padding:16px 0 10px}
.calc{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--brand)}
.calc b{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.rem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.rem:first-child{border-top:0}
.rem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rembox{margin:4px 0 10px}.rembox .acts{display:flex;gap:8px;flex-wrap:wrap}
.rprow{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:14px;color:var(--muted)}.rprow input{width:110px;flex:none}.rpbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin:10px 0 4px;text-align:left}.rpbox .rprow{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:0;font-size:13px}.rpbox .rprow input,.rpbox .rprow select{width:100%;max-width:none}.rpbox .rprow.opt,.rpbox .rpnote{grid-column:1/-1}.rpbox .rpnote{margin:0}.rpnote{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.linkbtn{background:none;border:0;padding:0;color:var(--brand);font:inherit;text-decoration:underline;cursor:pointer}.phonerow{display:flex;gap:8px;align-items:stretch}.phonerow input{flex:1;min-width:0}.phonerow .btn{flex:none}
.rem .msg{grid-column:1/-1;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
.rem .msg[dir="rtl"]{text-align:right}
@media (max-width:640px){.rem{grid-template-columns:minmax(0,1fr)}.rem .acts{justify-content:flex-start}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(17,26,51,.35);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:18px;width:100%;max-width:680px;padding:20px;box-shadow:0 20px 60px rgba(17,26,51,.18)}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.x{border:0;background:var(--panel);color:var(--brand);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;flex:none}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}
dl div{min-width:0}dt{font-size:12px;color:var(--muted)}dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:480px){dl{grid-template-columns:minmax(0,1fr)}}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.bal div{background:var(--panel);border-radius:10px;padding:10px 12px}
.bal span{font-size:12px;color:var(--muted);display:block}.bal b{font-variant-numeric:tabular-nums;font-size:17px}
.pay{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.pay:first-child{border-top:0}
label.cpk{margin-top:6px}label.cpk span{flex:1}.payform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
@media (max-width:560px){.payform{grid-template-columns:1fr 1fr}}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.login img{width:84px;height:84px;margin:0 auto}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.err{color:var(--bad);font-size:13.5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--panel);color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div id="app"><p class="wrap" style="padding-top:40px;color:var(--muted)">Loading…</p></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js?v=13"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
